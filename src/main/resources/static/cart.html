<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Koszyk</title>
    <link rel="stylesheet" href="css/cart.css">
</head>
<body>

<div class="container">

    <!-- Przycisk powrotu do sklepu -->
    <button onclick="window.location.href='main.html'" class="back-btn">
        ← Wróć do sklepu
    </button>

    <h1>Twój koszyk</h1>

    <div class="cart">

        <!-- Tu JavaScript wstawi pozycje koszyka -->
        <div class="cart-items" id="cart-items">
            <p>Ładowanie...</p>
        </div>

        <aside class="summary">
            <h2>Podsumowanie zamówienia</h2>

            <div class="row">
                <span>Liczba produktów</span>
                <span id="items-count">0</span>
            </div>

            <div class="row">
                <span>Dostawa</span>
                <span>15,00 zł</span>
            </div>

            <hr>

            <div class="row total">
                <span>Razem</span>
                <span id="total-price">0,00 zł</span>
            </div>

            <button class="checkout-btn">
                Przejdź do płatności
            </button>

            <!-- Przycisk czyszczenia koszyka -->
            <button class="clear-btn" onclick="clearCart()">
                🗑 Wyczyść koszyk
            </button>
        </aside>

    </div>

</div>

<!-- Dołączamy nasz plik JavaScript -->
<script src="js/cart.js"></script>

</body>
</html>
