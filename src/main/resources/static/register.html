<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rejestracja</title>

    <link rel="stylesheet" href="/css/register.css"></head>
<body class="auth-body">

<img src="/pictures/logo2.png" alt="Logo" class="logo">

<div class="box">
    <h2>Rejestracja</h2>
<form id="registerForm">
    <input type="text" id="username" placeholder="Nazwa użytkownika">

    <div class="field-error" id="usernameError"></div>

    <input type="email" id="email" placeholder="Email">

    <div class="field-error" id="emailError"></div>

    <input type="password" id="password" placeholder="Hasło">

    <div class="field-error" id="passwordError"></div>

    <button type="submit">Zarejestruj</button>
</form>
    <div class="switch">
        <span onclick="location.href='login.html'">
            Powrót do logowania
        </span>
    </div>

</div>

<script src="/js/utils.js"></script>
<script src="/js/register.js"></script>

</body>
</html>
