<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rejestracja</title>

    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="box">

    <h2>Rejestracja</h2>

    <input
        type="text"
        id="login"
        placeholder="Login"
    >

    <input
        type="email"
        id="email"
        placeholder="Email"
        required
    >

    <p id="error" style="color:red; display:none;">
        Wpisz poprawny adres email
    </p>

    <input
        type="password"
        id="password"
        placeholder="Hasło"
        required
    >

    <p id="passError" style="color:red; display:none;">
        Hasło musi mieć:
        <br>• dużą literę
        <br>• cyfrę
        <br>• znak specjalny
        <br>• minimum 8 znaków
    </p>

    <button>Załóż konto</button>

    <div class="switch">
        <span onclick="location.href='login.html'">
            Powrót do logowania
        </span>
    </div>

</div>

<script src="js/register.js"></script>

</body>
</html>
