<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>Panel Admina</title>

<style>
  body {
    margin: 0;
    font-family: Arial;
  }

  .container {
    display: flex;
    height: 100vh;
  }

  .left {
    width: 40%;
    padding: 20px;
    background: #f4f4f4;
  }

  .right {
    width: 60%;
    padding: 20px;
    overflow-y: auto;
  }

  input, textarea {
    width: 90%;
    padding: 8px;
    margin: 5px 0;
  }

  button {
    padding: 8px 12px;
    margin-top: 5px;
    cursor: pointer;
  }

  .product {
    border: 1px solid #ccc;
    padding: 10px;
    margin-bottom: 10px;
  }

  .product img {
    width: 80px;
    margin-top: 5px;
  }
</style>

</head>

<body>

<div class="container">

  <!-- LEWA STRONA - DODAWANIE -->
  <div class="left">

    <h2>Dodaj produkt</h2>

    <input id="name" placeholder="Nazwa">

    <textarea id="description" placeholder="Opis"></textarea>

    <input id="price" type="number" placeholder="Cena">

    <input id="quantity" type="number" placeholder="Ilość">

    <input id="image" placeholder="URL obrazka">

    <button onclick="addProduct()">
      Dodaj
    </button>

  </div>

  <!-- PRAWA STRONA - LISTA -->
  <div class="right">

    <h2>Produkty</h2>

    <div id="list"></div>

  </div>

</div>

<!-- PODPIĘCIE JS -->
<script src="script.js"></script>

</body>
</html>
